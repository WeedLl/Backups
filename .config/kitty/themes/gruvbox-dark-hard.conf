# gruvbox dark HARD — фон темнее (bg0 #1d2021 вместо #282828),
# остальные цвета ярче: normal = gruvbox bright, bright = осветлённые на 22% к fg0.
# Файл: ~/.config/kitty/themes/gruvbox-dark-hard.conf
# Активная копия: ~/.config/kitty/current-theme.conf
# Откат к medium-варианту: cp ~/.config/kitty/themes/gruvbox-dark.conf ~/.config/kitty/current-theme.conf
#
# Контраст к фону (WCAG): текст 14.5:1, normal 4.8–9.7:1, bright 5.8–10.5:1.

background            #1d2021
foreground            #fbf1c7
cursor                #fabd2f
cursor_text_color     #1d2021
selection_background  #3c3836
selection_foreground  #fbf1c7

# normal — это уже яркие варианты gruvbox (раньше тут были приглушённые)
color0   #1d2021
color1   #fb4934
color2   #b8bb26
color3   #fabd2f
color4   #83a598
color5   #d3869b
color6   #8ec07c
color7   #d5c4a1

# bright — осветлённые версии normal, чтобы жирный текст читался ещё контрастнее
color8   #bdae93
color9   #fb6e54
color10  #c7c749
color11  #fac850
color12  #9db6a2
color13  #dc9ea5
color14  #a6cb8c
color15  #ddcea9

# Вкладки в тон теме
active_tab_foreground   #1d2021
active_tab_background   #fabd2f
inactive_tab_foreground #a89984
inactive_tab_background #141414
