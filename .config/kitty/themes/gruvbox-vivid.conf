# gruvbox dark VIVID — тот же фон, но содержимое насыщеннее
# (ближе к характеру исходной темы: яркие, «звонкие» цвета на тёмном фоне).
# Файл: ~/.config/kitty/themes/gruvbox-vivid.conf
# Фон не менялся: #1d2021. Отличие только в color0–color15 и курсоре.

background            #1d2021
foreground            #fbf1c7
cursor                #ffd23f
cursor_text_color     #1d2021
selection_background  #3c3836
selection_foreground  #fbf1c7

# normal — насыщенные версии gruvbox-оттенков
color0   #1d2021
color1   #ff5f4d
color2   #c8d92f
color3   #ffc93f
color4   #4fd2b4
color5   #ea7fa4
color6   #8fdc72
color7   #e0cba0

# bright — те же, но светлее (для жирного текста и акцентов)
color8   #b3a486
color9   #ff7d6b
color10  #d6e64a
color11  #ffd45c
color12  #63ddc0
color13  #f294b5
color14  #a4e58a
color15  #f2e3be

active_tab_foreground   #1d2021
active_tab_background   #ffc93f
inactive_tab_foreground #b3a486
inactive_tab_background #141414
