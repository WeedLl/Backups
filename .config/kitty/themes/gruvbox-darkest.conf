# gruvbox dark «на максимум» — фон ещё темнее (#141414 вместо #1d2021).
# Тот же принцип: normal = яркие gruvbox-цвета, bright = осветлённые на 22% к fg0.
# Файл: ~/.config/kitty/themes/gruvbox-darkest.conf
#
# Переключение (из любого варианта):
#   cp ~/.config/kitty/themes/gruvbox-darkest.conf  ~/.config/kitty/current-theme.conf
#   cp ~/.config/kitty/themes/gruvbox-dark-hard.conf ~/.config/kitty/current-theme.conf   # назад к #1d2021
#   cp ~/.config/kitty/themes/gruvbox-dark.conf      ~/.config/kitty/current-theme.conf   # назад к #282828
# затем ctrl+shift+f5 в kitty.

