# Подключение темы Catppuccin Mocha — скачивается отдельно в ~/.config/alacritty/
#general.import = ["~/.config/alacritty/catppuccin-mocha.toml"]
#general.import = ["~/.config/alacritty/gitgub_dark.toml"]
general.import = ["~/.config/alacritty/mytheme.toml"]

[env]
TERM = "xterm-256color"

[colors]
draw_bold_text_with_bright_colors = true     # Нормальное отображение жирных цветов

                                             # --- Окно ---
[window]
padding = { x = 3, y = 3 }                   # Как в kitty: window_padding_width 3
startup_mode = "windowed"                    # Открывать окно в окне
                                             # (не полноэкранный режим, а просто максимизированное)
[window.dimensions]
columns = 130
lines = 40

                                             # --- Шрифт ---
[font]
size = 14.0                                  # Базовый размер шрифта в пунктах

[font.normal]
family = "JetBrainsMono NF"                 # Nerd Font нужен для иконок в промпте, Yazi и других TUI-приложениях.
                                             # Обычный JetBrains Mono иконки не покажет
style = "Regular"

[font.bold]
family = "JetBrainsMono NF"
style = "Bold"

[font.italic]
family = "JetBrainsMono NF"
style = "Italic"

                                             # --- Курсор ---
[cursor]
style = { shape = "Block", blinking = "On" } # Форма курсора — блочный, с миганием.
                                             # Block удобнее, чем Beam или Underline
unfocused_hollow = true                      # Когда окно не в фокусе, курсор становится пустым контуром
                                             # — видно, где курсор, но не отвлекает миганием

                                             # --- Мышь ---
[mouse]
hide_when_typing = true                      # Скрывает курсор мыши при наборе
                                             # текста — не мешает и не перекрывает символы

                                             # --- История прокрутки ---
[scrolling]
history = 100000                             # Сколько строк хранить в буфере прокрутки.
                                             # 100 000 — с запасом для длинных логов и вывода
#Visual mode
# TODO: согласовать Ctrl+U/D/Y с shell и остальными приложениями (см. журнал: клавиши alacritty/kitty/nvim/niri/Noctalia).
[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"

[[keyboard.bindings]]
key = "PageUp"
mods = "Control|Shift"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
mods = "Control|Shift"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "N"
mods = "Control|Shift"
action = "CreateNewWindow"

[[keyboard.bindings]]
key = "Q"
mods = "Control|Shift"
action = "Quit"

[[keyboard.bindings]]
key = "Equals"
mods = "Control|Shift"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control|Shift"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "0"
mods = "Control|Shift"
action = "ResetFontSize"
