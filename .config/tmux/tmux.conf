# Указываем стандартный 256-color терминал как базу.
set-option -g default-terminal "screen-256color"
# ГЛАВНОЕ: говорим Tmux, что ЛЮБОЙ терминал поддерживает true-color.
# Звездочка * означает "для всех". Именно это включит termguicolors в Neovim.
set-option -sa terminal-overrides ',*:Tc'
# OSC 52 / системный буфер (kitty, Alacritty)
set -g set-clipboard on

# Сортировка сессий по имени
bind s choose-tree -sZ -O name
# Изменение индексов вкладок
set -g base-index 1
setw -g pane-base-index 1
# Двойные рамки
set -g pane-border-lines "double"
# Ожидание после нажатия Esc
set -g escape-time 0
# История и события фокуса
set -g history-limit 100000
set -g focus-events on
setw -g aggressive-resize on
# Включение мыши
set -g mouse on

#Vim Key-map in copy ( prefix + [ )
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection 
bind-key -T copy-mode-vi 'y' send -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Основной префикс
set -g prefix C-q
# Key-map
## Разделение экрана
unbind %
bind | split-window -h 
unbind '"'
bind - split-window -v
## Перезагрузка конфига
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded :3"
## Изменение размера окон
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z
## Фокус панелей без конфликта с C-hjkl в nvim
bind -r H select-pane -L
bind -r J select-pane -D
bind -r K select-pane -U
bind -r L select-pane -R
# Режим навигации (перемещение панелей и между ними)
bind -r '<' swap-pane -D
bind -r '>' swap-pane -U
# Вращение панелей
bind -r o rotate-window -D   # по часовой
bind -r i rotate-window -U   # против часовой

# Отключение от сессии
bind q detach

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.config/tmux/plugins/'
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#Темы
set -g @plugin 'egel/tmux-gruvbox'
## Для работы с сессиями
set -g @plugin 'tmux-plugins/tmux-resurrect' 
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-sessionist'


# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Для работы с сессиями
set -g @resurrect-dir '~/.config/tmux/resurrect'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.config/tmux/plugins/tpm/tpm'
